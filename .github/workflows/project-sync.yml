# Keeps the Sluice project board in step with the labels and pull requests (docs/CONTRIBUTING.md → Labels and the board):
#
#   label triage → Triage     label ready → Ready     label in progress → In progress
#   pull request opened → In review (and the issues it fixes)     draft pull request → In progress
#   issue or pull request closed → Done
#
# New issues and pull requests are added to the board. The board belongs to the owner's account, so this uses the
# PROJECT_TOKEN secret (a classic token with only the "project" scope); without it the job does nothing.
# pull_request_target runs in this repository's context so it works for pull requests from forks; it only reads
# metadata and never checks out or runs the pull request's code.
name: Project board

on:
  issues:
    types: [opened, reopened, labeled, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # the base branch's script, never the pull request's
          sparse-checkout: .github/scripts
      - name: Set the board column
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "No PROJECT_TOKEN secret: skipping"; exit 0; fi
          set_status() { bash .github/scripts/project-status.sh "$1" "$2"; }

          if [ "$EVENT" = issues ]; then
            case "$ACTION" in
              closed) set_status "$ISSUE_ID" Done ;;
              labeled)
                case "$LABEL" in
                  triage) set_status "$ISSUE_ID" Triage ;;
                  ready) set_status "$ISSUE_ID" Ready ;;
                  "in progress") set_status "$ISSUE_ID" "In progress" ;;
                esac ;;
              opened|reopened)
                if jq -e 'index("in progress")' <<<"$ISSUE_LABELS" > /dev/null; then set_status "$ISSUE_ID" "In progress"
                elif jq -e 'index("ready")' <<<"$ISSUE_LABELS" > /dev/null; then set_status "$ISSUE_ID" Ready
                else set_status "$ISSUE_ID" Triage; fi ;;
            esac
            exit 0
          fi

          # Pull requests
          case "$ACTION" in
            closed) set_status "$PR_ID" Done; exit 0 ;;
            converted_to_draft) column="In progress" ;;
            *) if [ "$PR_DRAFT" = true ]; then column="In progress"; else column="In review"; fi ;;
          esac
          set_status "$PR_ID" "$column"
          # The issues it fixes ("Fixes #N") move with it.
          gh api graphql -f query='
            query($o: String!, $n: String!, $p: Int!) {
              repository(owner: $o, name: $n) {
                pullRequest(number: $p) { closingIssuesReferences(first: 20) { nodes { id state } } }
              }
            }' -f o="${REPO%/*}" -f n="${REPO#*/}" -F p="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.state == "OPEN") | .id' |
          while read -r issue; do set_status "$issue" "$column"; done
